# swtpm-tools owns /var/lib/swtpm-localca (tss:root 0750), but bootc does not
# populate /var from the RPM payload, so swtpm_localca (running as tss) cannot
# create it and TPM-enabled libvirt VMs fail to start.
# https://github.com/ublue-os/bluefin/issues/4916
d /var/lib/swtpm-localca 0750 tss root -
