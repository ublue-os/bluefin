# mcelog exits with "CPU is unsupported" on AMD family 0x10 and newer (and
# Hygon), where the kernel's edac_mce_amd decodes machine checks instead.
# The unit only skips itself when edac_mce_amd is already loaded, which it
# never is in a VM and may not be yet on bare metal, so it fails at boot.
# Ask mcelog first: exit status 1 here skips the unit instead of failing it.
# Intel CPUs are supported and keep running mcelog as before.
[Service]
ExecCondition=/usr/sbin/mcelog --is-cpu-supported
